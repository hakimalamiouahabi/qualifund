name: Importer la release QUALIFUND
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-release.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire les fichiers du projet
        run: |
          set -euo pipefail
          unzip -q release/qualifund-v12.2.0.zip -d /tmp/qualifund-import
          cp -a /tmp/qualifund-import/LEYTON-RADAR-v12.2.0-FINAL/. .
          rm -f .github/workflows/update-and-deploy.yml .github/workflows/validate.yml
          rm -rf release
          git config user.name "qualifund-import-bot"
          git config user.email "qualifund-import-bot@users.noreply.github.com"
          git add -A
          git commit -m "Import QUALIFUND v12.2.0" || true
          git push origin HEAD:main

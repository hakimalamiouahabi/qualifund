name: FUNDING RADAR — CI non destructive

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'schemas/**'
      - 'tests/**'
      - 'api/**'
      - 'site/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: funding-radar-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Tests de non-régression
        run: npm test
      - name: Validation du schéma de données
        run: npm run validate
      - name: Normaliser le workspace éphémère avant audit
        run: node scripts/purge-indirect-sources.mjs
      - name: Audit structurel strict
        run: npm run audit:deep:strict

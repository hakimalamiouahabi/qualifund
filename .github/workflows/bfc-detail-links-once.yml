name: BFC — comptabilité liens détail ponctuelle
on:
  push:
    branches: [maintenance/bfc-probe-once]
    paths:
      - '.github/workflows/bfc-detail-links-once.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Comptabiliser les liens Plus de détails
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          import {cleanTitle} from './scripts/lib/utils.mjs';
          const base='https://www.bourgognefranchecomte.fr/guide-des-aides';
          const headers={'user-agent':'Mozilla/5.0','accept-language':'fr-FR,fr;q=0.9'};
          let expected=0,total=0,pages=0;const byKind={},samples=[];
          for(let page=0;page<60;page++){
            const u=new URL(base);
            u.searchParams.set('field_domaine_target_id','All');
            u.searchParams.set('field_vous_etes_target_id','87');
            u.searchParams.set('field_types_value','All');
            u.searchParams.set('page',String(page));
            const r=await fetch(u,{headers});const html=await r.text();const $=cheerio.load(html);
            const body=cleanTitle($('body').text()||'');
            if(!expected)expected=Number(body.match(/(\d+)\s+aide\(s\)\s*&\s*service\(s\)/i)?.[1]||0);
            let n=0;
            $('a[href]').each((_,a)=>{
              const label=cleanTitle($(a).text()||'');
              if(!/^Plus de détails$/i.test(label))return;
              n++;total++;
              const href=$(a).attr('href')||'';
              let kind='other';
              if(/^\/node\/\d+/.test(href))kind='node';
              else if(/^https?:\/\//.test(href))kind='absolute';
              else if(href.startsWith('/'))kind='relative';
              byKind[kind]=(byKind[kind]||0)+1;
              if(samples.length<80&&kind!=='node')samples.push({page,href});
            });
            pages++;
            if(n===0&&page>2)break;
          }
          console.log('BFC_DETAIL_LINKS='+JSON.stringify({expected,total,pages,byKind,samples}));
          NODE

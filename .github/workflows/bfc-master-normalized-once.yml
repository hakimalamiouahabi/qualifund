name: BFC — normalisation master ponctuelle
on:
  push:
    branches: [maintenance/bfc-probe-once]
    paths:
      - '.github/workflows/bfc-master-normalized-once.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Normaliser les 326 résultats
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          import {cleanTitle} from './scripts/lib/utils.mjs';
          const BASE='https://www.bourgognefranchecomte.fr';
          const GUIDE=BASE+'/guide-des-aides';
          const headers={'user-agent':'Mozilla/5.0','accept-language':'fr-FR,fr;q=0.9'};
          const canon=href=>{
            let p=href.replace(/^\/index\.php\/node\/(\d+)/,'/node/$1');
            return new URL(p,BASE).href;
          };
          const unique=new Map();let expected=0,total=0,pages=0;const nonNode=new Set();
          for(let page=0;page<60;page++){
            const u=new URL(GUIDE);
            u.searchParams.set('field_domaine_target_id','All');
            u.searchParams.set('field_vous_etes_target_id','87');
            u.searchParams.set('field_types_value','All');
            u.searchParams.set('page',String(page));
            const r=await fetch(u,{headers});const html=await r.text();const $=cheerio.load(html);
            const body=cleanTitle($('body').text()||'');
            if(!expected)expected=Number(body.match(/(\d+)\s+aide\(s\)\s*&\s*service\(s\)/i)?.[1]||0);
            let n=0;
            $('a[href]').each((_,a)=>{
              const label=cleanTitle($(a).text()||'');
              if(!/^Plus de détails$/i.test(label))return;
              n++;total++;
              const href=$(a).attr('href')||'';const url=canon(href);
              if(!/\/node\/\d+$/.test(new URL(url).pathname))nonNode.add(url);
              unique.set(url,(unique.get(url)||0)+1);
            });
            pages++;
            if(n===0&&page>2)break;
          }
          const dup=[...unique.entries()].filter(([,n])=>n>1).sort((a,b)=>b[1]-a[1]);
          console.log('BFC_MASTER='+JSON.stringify({
            expected,total,pages,unique:unique.size,duplicateOccurrences:total-unique.size,
            nonNode:[...nonNode],topDuplicates:dup.slice(0,30)
          }));
          NODE

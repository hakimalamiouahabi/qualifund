name: FUNDING RADAR — collecte, certification et publication

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Recontrôler et enrichir toutes les fiches'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '0 2 * * *'
      timezone: 'Europe/Paris'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'config/**'
      - 'schemas/**'
      - 'tests/**'
      - 'api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

concurrency:
  group: qualifund-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      pages: read
    outputs:
      data_sha: ${{ steps.commit_data.outputs.sha }}
      collection_locked: ${{ steps.lock.outputs.locked }}
      collection_name: ${{ steps.lock.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lire le verrou de collecte
        id: lock
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('config/collection-lock.json','utf8'));
          console.log('locked='+(j.locked?'true':'false'));
          console.log('name='+(j.name||'ALL'));
          NODE
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Purger et persister les anciennes sources avant toute collecte
        if: ${{ steps.lock.outputs.locked != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/purge-indirect-sources.mjs
          git config user.name "qualifund-bot"
          git config user.email "qualifund-bot@users.noreply.github.com"
          git add -A site/data site/bibliotheque
          if git ls-files --error-unmatch LEYTON-RADAR-v12.2.0-AUTONOME-LIVE.html >/dev/null 2>&1; then
            git add -u -- LEYTON-RADAR-v12.2.0-AUTONOME-LIVE.html
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): purge definitive des sources tierces [skip ci]"
            git push origin HEAD:main
          fi
      - name: Installer les dépendances de façon reproductible
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            echo 'Bootstrap du lockfile npm (première exécution uniquement).'
            npm install --ignore-scripts --no-audit --no-fund
          fi
      - name: Persister le lockfile bootstrap avant la collecte
        if: ${{ hashFiles('package-lock.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "qualifund-bot"
            git config user.email "qualifund-bot@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): bootstrap package-lock [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Installer Chromium Playwright
        run: npx playwright install --with-deps chromium
      - name: Auditer le registre maître
        run: npm run audit:sources
      - name: Préflight santé des sources directes
        run: npm run preflight:sources
      - name: Sauvegarder la bibliothèque précédente
        run: |
          mkdir -p /tmp/qualifund
          cp site/data/library.json /tmp/qualifund/library-before.json || echo '{"aaps":[]}' > /tmp/qualifund/library-before.json
      - name: Collecte complète quotidienne / manuelle
        env:
          QUALIFUND_FULL_REFRESH: '1'
        run: npm run update:full
      - name: Certifier le guichet ou la région verrouillée
        if: ${{ steps.lock.outputs.locked == 'true' }}
        run: npm run certify:active
      - name: Rapport quotidien des changements
        run: node scripts/generate-daily-report.mjs /tmp/qualifund/library-before.json site/data/library.json site/bibliotheque/rapports
      - name: Synchroniser les artefacts publics
        run: npm run sync:metadata
      - name: Reconstruire l'index de recherche
        run: npm run build:index
      - name: Valider le bundle Cloudflare certifié
        run: npm run build:cloudflare
      - name: Auditer l'ingestion
        run: npm run audit:ingestion
      - name: Auditer les critères et leurs preuves officielles
        run: npm run audit:criteria
      - name: Tests unitaires
        run: npm test
      - name: Validation schéma
        run: npm run validate
      - name: Recette UAT pertinence
        run: npm run uat
      - name: Smoke SIREN officiel
        run: npm run smoke:live -- --strict-company
      - name: QA
        run: npm run qa >> "$GITHUB_STEP_SUMMARY"
      - name: Rapport de remédiation preuves
        if: ${{ steps.lock.outputs.locked != 'true' }}
        run: npm run remediation >> "$GITHUB_STEP_SUMMARY"
      - name: Pré-readiness du cycle
        run: npm run production:gates >> "$GITHUB_STEP_SUMMARY"
      - name: Commit des données générées
        id: commit_data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "qualifund-bot"
          git config user.email "qualifund-bot@users.noreply.github.com"
          git add package-lock.json site/data site/bibliotheque site/runtime-config.js site/sw.js PRODUCTION_READINESS.md REMEDIATION_REPORT.md || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): actualisation FUNDING RADAR [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configurer GitHub Pages
        if: ${{ steps.lock.outputs.locked != 'true' }}
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Charger l'artefact Pages
        if: ${{ steps.lock.outputs.locked != 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: ${{ needs.build.outputs.collection_locked != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-production:
    needs: [build, deploy]
    if: ${{ needs.build.outputs.collection_locked != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - name: Checkout du corpus réellement publié
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.data_sha }}
      - name: Lire le verrou de collecte publié
        id: lock
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('config/collection-lock.json','utf8'));
          console.log('locked='+(j.locked?'true':'false'));
          console.log('name='+(j.name||'ALL'));
          NODE
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Valider SIREN + site public après déploiement
        env:
          RADAR_PUBLIC_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/live-smoke.mjs --strict-company --strict-public
      - name: Recette UAT finale
        run: npm run uat
      - name: Calculer la readiness finale sur le SHA publié
        if: ${{ steps.lock.outputs.locked != 'true' }}
        env:
          RADAR_PUBLIC_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run production:gates >> "$GITHUB_STEP_SUMMARY"
      - name: Persister les preuves de production
        id: commit_proofs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "qualifund-bot"
          git config user.email "qualifund-bot@users.noreply.github.com"
          git add site/data/live-smoke.json site/data/uat-results.json site/data/production-readiness.json PRODUCTION_READINESS.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(validation): preuves production [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Certification production stricte
        if: ${{ steps.lock.outputs.locked != 'true' }}
        run: npm run certify:production
      - name: Reconfigurer Pages pour l'artefact vérifié
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Charger le site avec readiness finale
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-verified
          path: site

  redeploy-verified:
    needs: [build, verify-production]
    if: ${{ needs.build.outputs.collection_locked != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.final_deployment.outputs.page_url }}
    steps:
      - name: Publier la version avec preuves finales
        id: final_deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-verified


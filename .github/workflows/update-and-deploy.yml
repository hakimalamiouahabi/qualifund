name: FUNDING RADAR — collecte, certification et publication

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Recontrôler et enrichir toutes les fiches'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '0 2 * * *'
      timezone: 'Europe/Paris'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'config/**'
      - 'schemas/**'
      - 'tests/**'
      - 'api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

concurrency:
  group: funding-radar-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    outputs:
      data_sha: ${{ steps.commit_data.outputs.sha }}
      collection_locked: ${{ steps.lock.outputs.locked }}
      collection_name: ${{ steps.lock.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lire le verrou de collecte
        id: lock
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('config/collection-lock.json','utf8'));
          console.log('locked='+(j.locked?'true':'false'));
          console.log('name='+(j.name||'ALL'));
          NODE
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Installer les dépendances de façon reproductible
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            echo 'Bootstrap du lockfile npm (première exécution uniquement).'
            npm install --ignore-scripts --no-audit --no-fund
          fi
      - name: Persister le lockfile bootstrap avant la collecte
        if: ${{ hashFiles('package-lock.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "funding-radar-bot"
            git config user.email "funding-radar-bot@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): bootstrap package-lock [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Gate statique avant toute mutation des données
        shell: bash
        run: |
          set -euo pipefail
          find scripts tests -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          npm test
          npm run validate
      - name: Purger et persister le stock hors sources certifiées / cycle courant
        shell: bash
        run: |
          set -euo pipefail
          node scripts/purge-indirect-sources.mjs
          git config user.name "funding-radar-bot"
          git config user.email "funding-radar-bot@users.noreply.github.com"
          git add -A site/data site/bibliotheque
          if git ls-files --error-unmatch LEYTON-RADAR-v12.2.0-AUTONOME-LIVE.html >/dev/null 2>&1; then
            git add -u -- LEYTON-RADAR-v12.2.0-AUTONOME-LIVE.html
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): purge du stock hors périmètre certifié [skip ci]"
            git push origin HEAD:main
          fi
      - name: Installer Chromium Playwright
        run: npx playwright install --with-deps chromium
      - name: Auditer le registre maître
        run: npm run audit:sources
      - name: Préflight santé des sources directes
        run: npm run preflight:sources
      - name: Sauvegarder la bibliothèque précédente
        run: |
          mkdir -p /tmp/funding-radar
          cp site/data/library.json /tmp/funding-radar/library-before.json || echo '{"aaps":[]}' > /tmp/funding-radar/library-before.json
      - name: Collecte complète quotidienne / manuelle
        env:
          FUNDING_RADAR_FULL_REFRESH: '1'
        run: npm run update:full
      - name: Certifier le guichet ou la région verrouillée
        if: ${{ steps.lock.outputs.locked == 'true' }}
        run: npm run certify:active
      - name: Rapport quotidien des changements
        run: node scripts/generate-daily-report.mjs /tmp/funding-radar/library-before.json site/data/library.json site/bibliotheque/rapports
      - name: Synchroniser les artefacts publics
        run: npm run sync:metadata
      - name: Reconstruire l'index de recherche
        run: npm run build:index
      - name: Auditer l'ingestion
        run: npm run audit:ingestion
      - name: Auditer les critères et leurs preuves officielles
        run: npm run audit:criteria
      - name: Audit approfondi data engineering — gate P0
        run: npm run audit:deep:strict
      - name: Tests unitaires
        run: npm test
      - name: Validation schéma
        run: npm run validate
      - name: Recette UAT pertinence
        run: npm run uat
      - name: Smoke SIREN officiel
        run: npm run smoke:live -- --strict-company
      - name: QA
        run: npm run qa >> "$GITHUB_STEP_SUMMARY"
      - name: Rapport de remédiation preuves
        run: npm run remediation >> "$GITHUB_STEP_SUMMARY"
      - name: Readiness du cycle courant
        run: npm run production:gates >> "$GITHUB_STEP_SUMMARY"
      - name: Commit des données générées
        id: commit_data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "funding-radar-bot"
          git config user.email "funding-radar-bot@users.noreply.github.com"
          git add package-lock.json site/data site/bibliotheque site/runtime-config.js site/sw.js PRODUCTION_READINESS.md REMEDIATION_REPORT.md DATA_QUALITY_AUDIT.md || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): actualisation FUNDING RADAR [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Construire l'artefact public certifié
        run: npm run build:cloudflare

  verify-production:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RADAR_PUBLIC_URL: https://qualifund.pages.dev
    steps:
      - name: Checkout du corpus réellement publié
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.data_sha }}
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Installer les dépendances de validation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Attendre le déploiement Cloudflare du SHA publié
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.data_sha }}
        run: |
          set -euo pipefail
          echo "Attente Cloudflare Pages : $RADAR_PUBLIC_URL — SHA $EXPECTED_SHA"
          for i in $(seq 1 60); do
            payload="$(curl -fsS --max-time 15 "$RADAR_PUBLIC_URL/data/build-info.json?ts=$(date +%s)" || true)"
            live_sha="$(printf '%s' "$payload" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).commitSha||'')}catch{}})")"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "Cloudflare Pages synchronisé sur $live_sha"
              exit 0
            fi
            echo "Tentative $i/60 — SHA public: ${live_sha:-indisponible}"
            sleep 10
          done
          echo "Cloudflare Pages n'a pas publié le SHA attendu dans le délai imparti." >&2
          exit 1
      - name: Valider SIREN + production Cloudflare
        run: node scripts/live-smoke.mjs --strict-company --strict-public
      - name: Recette UAT finale
        run: npm run uat
      - name: Calculer la readiness finale sur Cloudflare
        run: npm run production:gates >> "$GITHUB_STEP_SUMMARY"
      - name: Persister les preuves de production
        id: commit_proofs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "funding-radar-bot"
          git config user.email "funding-radar-bot@users.noreply.github.com"
          git add site/data/live-smoke.json site/data/uat-results.json site/data/production-readiness.json PRODUCTION_READINESS.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(validation): preuves production Cloudflare [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Certification production stricte
        if: ${{ needs.build.outputs.collection_locked != 'true' }}
        run: npm run certify:production

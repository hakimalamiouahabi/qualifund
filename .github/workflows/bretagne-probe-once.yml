name: Bretagne — probe catalogue officiel ponctuel
on:
  push:
    branches: [maintenance/bretagne-probe-once]
    paths:
      - '.github/workflows/bretagne-probe-once.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lire le catalogue Bretagne
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          const url='https://www.bretagne.bzh/aides/';
          const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0','accept-language':'fr-FR,fr;q=0.9'}});
          const html=await r.text(),$=cheerio.load(html);
          const body=$('body').text().replace(/\s+/g,' ').trim();
          const count=Number(body.match(/(\d+)\s+aides?\b/i)?.[1]||0);
          const selects={};
          $('select').each((_,s)=>{
            const key=$(s).attr('name')||$(s).attr('id')||'';
            const opts=[];
            $(s).find('option').each((__,o)=>opts.push({value:$(o).attr('value')||'',label:$(o).text().replace(/\s+/g,' ').trim()}));
            selects[key]=opts;
          });
          const links=[];
          $('a[href*="/aides/fiches/"]').each((_,a)=>{
            const href=$(a).attr('href')||'',label=$(a).text().replace(/\s+/g,' ').trim();
            if(href)links.push({href,label});
          });
          console.log('BRETAGNE_ROOT='+JSON.stringify({
            status:r.status,bytes:html.length,count,selects,
            uniqueLinks:[...new Map(links.map(x=>[x.href,x])).values()].slice(0,30)
          }));
          NODE

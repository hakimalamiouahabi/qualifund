name: QUALIFUND — audit volume primaire
on:
  push:
    branches: ['audit/primary-volume']
    paths:
      - 'scripts/audit-primary-volume.mjs'
      - '.github/workflows/primary-volume-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/audit-primary-volume.mjs
